[project]
name = "signal-platform"
version = "0.1.0"
description = "Shared platform library for derived-signal MCP services"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_platform"]
