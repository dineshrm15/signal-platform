name: Publish

# Tag push (v1.2.3) -> PyPI. Manual run -> TestPyPI (dry run).
#
# Uses PyPI trusted publishing (OIDC): no API tokens are stored anywhere. Each package
# uploads from its own job with its own GitHub environment, and each PyPI project's
# trusted publisher names that environment:
#
#   package              pypi.org environment       test.pypi.org environment
#   signal-platform      pypi                       testpypi
#   trading-vol-regime   pypi-trading-vol-regime    testpypi-trading-vol-regime
#
# One environment per package is required, not cosmetic: PyPI maps a workflow identity
# (owner/repo/workflow/environment) to one publisher, so a shared identity can create
# only the first new project; uploads for the next new project are rejected with
# "Non-user identities cannot create new projects".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --all-packages --locked

      - name: Lint, format, test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Tag matches trading-vol-regime version
        if: github.event_name == 'push'
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('services/trading-vol-regime/pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          fi

      - name: Build
        run: uv build --all-packages -o dist

      # Install the built wheels into a clean environment, the way a PyPI user would.
      - name: Smoke-test wheels
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/trading-vol-regime --help > /dev/null
          /tmp/smoke/bin/trading-vol-regime-server --help > /dev/null
          /tmp/smoke/bin/python -c "import trading_vol_regime.server, signal_platform.push"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Dependencies upload first, so a published trading-vol-regime never requires a
  # signal-platform version that failed to upload.
  pypi-signal-platform:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/signal-platform/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Select signal-platform files
        run: mkdir upload && mv dist/signal_platform-* upload/ && ls upload
      # skip-existing: a release that only bumps one package re-uploads the other's
      # unchanged version, which PyPI would otherwise reject.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true

  pypi-trading-vol-regime:
    if: github.event_name == 'push'
    needs: [build, pypi-signal-platform]
    runs-on: ubuntu-latest
    environment:
      name: pypi-trading-vol-regime
      url: https://pypi.org/project/trading-vol-regime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Select trading-vol-regime files
        run: mkdir upload && mv dist/trading_vol_regime-* upload/ && ls upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - files: signal_platform
            environment: testpypi
          - files: trading_vol_regime
            environment: testpypi-trading-vol-regime
    environment:
      name: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Select ${{ matrix.files }} files
        run: mkdir upload && mv dist/${{ matrix.files }}-* upload/ && ls upload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          skip-existing: true
