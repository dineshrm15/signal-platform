[project]
name = "vix-regime"
version = "0.1.0"
description = "Volatility regime intelligence MCP server (CBOE public data, 15-min delayed)"
requires-python = ">=3.12"
dependencies = [
    "signal-platform",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
vix-regime = "vix_regime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vix_regime"]
