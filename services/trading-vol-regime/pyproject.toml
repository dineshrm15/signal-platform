[project]
name = "trading-vol-regime"
version = "0.1.0"
description = "Volatility regime intelligence MCP server (CBOE public data, 15-min delayed)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "signal-platform",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
trading-vol-regime = "trading_vol_regime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_vol_regime"]
