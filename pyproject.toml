[project]
name = "signal-platform-workspace"
version = "0.1.0"
description = "Derived-signal MCP services monorepo"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
signal-platform = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.22",  # 0.21 can't mock httpx 0.28
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
